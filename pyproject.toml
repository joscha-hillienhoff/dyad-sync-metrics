[project]
name = "dyad-sync-metrics"
version = "0.1.0"
description = "Movement synchrony, gaze and surrogate-baseline measures for two-person interaction recordings"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.5",
    "scipy==1.18.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
filterwarnings = ["error"]
